services:
  - type: web
    name: contentgen-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contentgen-db
          property: connectionString
      - key: PORT
        value: 8787
      - key: PUBLISHING_ENABLED
        value: ""
databases:
  - name: contentgen-db
